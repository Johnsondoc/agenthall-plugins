<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: transparent;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 8px;
        color: light-dark(#1f2430, #f3f4f7);
      }

      .card {
        width: min(100%, 520px);
        overflow: hidden;
        border: 1px solid light-dark(#d9dde6, #343642);
        border-radius: 14px;
        background: light-dark(#ffffff, #191a20);
        box-shadow: 0 8px 24px light-dark(#11182712, #00000030);
      }

      .title {
        padding: 18px 18px 14px;
        border-bottom: 1px solid light-dark(#eceef3, #2a2c35);
        font-size: 16px;
        font-weight: 650;
      }

      .details {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
      }

      .label,
      .value {
        min-height: 48px;
        padding: 14px 18px;
        border-bottom: 1px solid light-dark(#eceef3, #2a2c35);
      }

      .label {
        color: light-dark(#707786, #9da2af);
        font-size: 14px;
      }

      .value {
        overflow: hidden;
        font-size: 14px;
        font-weight: 560;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px 18px;
      }

      button {
        flex: 0 0 auto;
        min-height: 42px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #7953e8;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        white-space: nowrap;
      }

      button:hover {
        background: #6d47dc;
      }

      button:focus-visible {
        outline: 3px solid #9e8af3;
        outline-offset: 2px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      .status {
        color: light-dark(#707786, #a5a9b5);
        font-size: 13px;
      }

      .sent .details,
      .sent button {
        display: none;
      }

      .error .details,
      .error button {
        display: none;
      }

      .error .actions {
        min-height: 76px;
        padding: 18px;
      }

      .error .status {
        color: light-dark(#525866, #c3c6cf);
        font-size: 14px;
        line-height: 1.55;
      }

      .sent .actions {
        min-height: 62px;
      }
    </style>
  </head>
  <body>
    <main class="card" id="card" aria-live="polite">
      <div class="title" id="title">确认发送</div>
      <div class="details">
        <div class="label">收件人</div>
        <div class="value" id="recipient">—</div>
        <div class="label">文件名</div>
        <div class="value" id="filename">—</div>
      </div>
      <div class="actions">
        <button id="send" type="button" disabled>发送文件</button>
        <span class="status" id="status">尚未发送</span>
      </div>
    </main>

    <script>
      const card = document.getElementById("card");
      const title = document.getElementById("title");
      const recipient = document.getElementById("recipient");
      const filename = document.getElementById("filename");
      const send = document.getElementById("send");
      const status = document.getElementById("status");
      const pending = new Map();
      let nextRequestId = 1;
      let handoffId = "";

      function request(method, params) {
        const id = nextRequestId++;
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
        });
      }

      function render(structuredContent) {
        if (
          !structuredContent?.ok &&
          structuredContent?.error?.code === "RECIPIENT_NOT_READY"
        ) {
          card.classList.add("error");
          title.textContent = "暂时无法发送";
          status.textContent =
            "对方尚未连接可接收文件的 Agent。请对方完成 AgentHall 连接后重试；文件尚未发送。";
          send.disabled = true;
          return;
        }
        const value = structuredContent?.value;
        const table = value?.confirmationTable;
        const confirmation = value?.confirmation;
        if (!structuredContent?.ok || !table || !confirmation?.handoffId) {
          card.classList.add("error");
          title.textContent = "暂时无法发送";
          status.textContent = "无法生成发送预览";
          send.disabled = true;
          return;
        }
        card.classList.remove("error");
        title.textContent = "确认发送";
        recipient.textContent = String(table.recipient ?? "—");
        filename.textContent = String(table.filename ?? "—");
        handoffId = String(confirmation.handoffId);
        send.disabled = false;
      }

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (message.id !== undefined && pending.has(message.id)) {
            const operation = pending.get(message.id);
            pending.delete(message.id);
            if (message.error) operation.reject(message.error);
            else operation.resolve(message.result);
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            render(message.params?.structuredContent);
          }
        },
        { passive: true },
      );

      if (window.openai?.toolOutput) render(window.openai.toolOutput);

      send.addEventListener("click", async () => {
        if (!handoffId || send.disabled) return;
        send.disabled = true;
        status.textContent = "正在发送…";
        try {
          const response = await request("tools/call", {
            name: "agenthall_confirm_handoff",
            arguments: {
              handoff_id: handoffId,
              confirmation_phrase: "发送",
            },
          });
          if (response?.isError) throw new Error("send_failed");
          card.classList.add("sent");
          status.textContent = "已发送";
        } catch {
          send.disabled = false;
          status.textContent = "发送失败，请重试";
        }
      });
    </script>
  </body>
</html>
